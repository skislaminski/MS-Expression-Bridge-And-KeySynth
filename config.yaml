# Zoom MS-60B+ Expression Bridge

ports:                            # substring of the port name, must be unique
  zoom: "ZOOM MS Plus Series"     # not just "ZOOM": the UAC-232 has MIDI ports too
  chocolate: "SINCO"              # how the M-Vave Chocolate Plus shows up

zoom:
  device_id: 0x6E                 # from `python probe.py identity`
  firmware: "1.20"

expression:                       # from `python probe.py cc`
  cc: 25
  channel: 1                      # 1–16
  min: 0
  max: 127
  invert: false

bridge:
  min_interval_ms: 10             # minimum time between two parameter messages
  deadband: 0                     # CC steps ignored as jitter (the pedal was quiet)
  passthrough: false              # pass the Chocolate's program change and bank select (CC 0/32) through

ui:
  port: 8765                      # interface: http://127.0.0.1:8765

# Up to four parameters per preset. This section is written by the interface and must stay at
# the end of the file. Key "bank/program", as the pedal reports the preset:
# bank = (display - 1) // 10, program = (display - 1) % 10 (measured on preset 095 = "9/4").
# slot = effect number - 1, param = parameter number + 1. min/max may narrow the learned range
# (measurements.json) but not leave it. invert: true = heel max, toe min.
# curve: linear, log (changes early) or exp (changes late).
mappings:
  "9/4":   # preset 095
    - {slot: 0, param: 2, min: 0, max: 100, invert: false, curve: linear, name: ''}
